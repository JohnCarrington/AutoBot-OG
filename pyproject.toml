[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autobot-og"
version = "0.0.0"
description = "Systematic FX trading bot (v1, GBPUSD) — regime-gated multi-strategy."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    # Pandas / numpy pinned to the versions the v1 indicator and risk layers
    # were written against (Phases 1-5). Bumping without re-running the suite
    # risks subtle pandas-API drift (e.g. DataFrame.iloc behaviour, dtype
    # coercion). Keep these tight until a deliberate upgrade pass.
    "pandas==2.3.3",
    "numpy==2.2.6",
    # Phase 6 — IG broker connectivity. Pin to the exact production version
    # the legacy /home/autobot/autobot-og-port-staging/requirements.txt
    # ships. The trading_ig 0.0.16 quirks (resolution string handling,
    # token-extraction surface) are codified in feed/ig_rest/auth.py;
    # bumping the version invalidates those shims and requires a full
    # adapter re-test against the live IG demo endpoint.
    "trading-ig==0.0.16",
    # Required by trading_ig for IGService construction and used by the
    # ig_rest.auth module to load credentials from .env. Pinned loosely
    # because it has no surface-shaped API in our wrapper.
    "python-dotenv>=1.0",
    # Phase 7 — Lightstreamer streaming client for IG native 5m candle
    # subscription (CHART:{epic}:5MINUTE, MERGE mode). Pinned to the
    # exact version installed on AutoBotV1 (verified via
    # `pip show lightstreamer-client-lib` on prod). PyPI dist name is
    # `lightstreamer-client-lib`; the import path is `lightstreamer.client`.
    # Probe results: scripts/probe_lightstreamer_output_2026-05-15.json.
    "lightstreamer-client-lib==1.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
